# Services sur Unraid (chef d'orchestre — toujours allumé)
name: jarvis

services:

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: http://${HOST_IP:-localhost}:8000
        NEXT_PUBLIC_API_KEY: ${API_KEY:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - jarvis

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    # Lance les migrations puis démarre l'API
    command: >
      sh -c "cd /app && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      # Docker socket — permet à l'Agent Unraid de lire les conteneurs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # État Unraid (array, disques) — read-only, fichiers de l'hôte
      - /var/local/emhttp:/var/local/emhttp:ro
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      UNRAID_EMHTTP_PATH: /var/local/emhttp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - jarvis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jarvis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jarvis

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jarvis

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  jarvis:
    driver: bridge
