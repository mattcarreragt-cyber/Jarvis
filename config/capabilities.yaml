# Capability Registry — mappe capacité → (machine, backend, modèle, GPU)
# Rechargeable à chaud sans redémarrer l'API.
# Voir docs/08_ORCHESTRATION.md
#
# ┌─ DIMENSIONNEMENT MATÉRIEL (nœud Kubuntu) ─────────────────────────────────┐
# │ GPU : 8 Go VRAM   |   RAM système : 64 Go                                  │
# │ Budget VRAM : ~8 Go. On NE PEUT PAS co-charger un gros LLM + SDXL +        │
# │ Whisper en même temps. Le champ `vram_gb` estime l'empreinte de chaque    │
# │ capacité ; le scheduler décharge un modèle avant d'en charger un autre    │
# │ si le budget serait dépassé. Les 64 Go de RAM permettent l'offload CPU    │
# │ partiel des couches qui débordent (chat.deep), au prix de la vitesse.     │
# └───────────────────────────────────────────────────────────────────────────┘

vram_budget_gb: 8

capabilities:

  chat.fast:
    machine: kubuntu
    backend: ollama
    model: qwen2.5:7b
    gpu: true
    vram_gb: 5
    description: "Réponse rapide, reformulation, tâches courtes (100% GPU)"

  chat.deep:
    machine: kubuntu
    backend: ollama
    model: qwen2.5:14b
    gpu: true
    vram_gb: 9          # déborde un peu → offload CPU partiel (RAM 64 Go)
    description: "Raisonnement, stratégie, analyse, code complexe (offload CPU partiel)"

  embeddings:
    machine: kubuntu
    backend: ollama
    model: nomic-embed-text
    gpu: true
    vram_gb: 1
    description: "Génération d'embeddings pour la mémoire sémantique (très léger)"

  stt:
    machine: kubuntu
    backend: faster-whisper
    model: large-v3
    compute_type: int8_float16   # réduit l'empreinte VRAM sur 8 Go
    gpu: true
    vram_gb: 3
    description: "Transcription audio → texte (à la demande)"

  tts:
    machine: unraid
    backend: piper
    model: fr_FR-upmc-medium
    gpu: false
    vram_gb: 0
    description: "Synthèse vocale texte → audio (CPU Unraid, Kubuntu non requis)"

  image:
    machine: kubuntu
    backend: comfyui
    model: sdxl
    gpu: true
    vram_gb: 8          # serré : ne pas co-charger avec un LLM
    exclusive: true     # nécessite de décharger les autres modèles GPU d'abord
    description: "Génération d'images (occupe quasiment tout le GPU 8 Go)"

  video:
    machine: kubuntu
    backend: comfyui
    model: animatediff-sd15      # AnimateDiff + fenêtres de contexte (8 Go OK)
    gpu: true
    vram_gb: 8
    exclusive: true              # décharge LLM + ne co-charge pas avec l'image
    workflow: config/comfyui_video_workflow.json
    description: "Génération de vidéo 10-20 s (512x512, asynchrone, plusieurs min)"

  # ─── 3e palier : RunPod (GPU cloud) — gros modèles que 8 Go ne peut pas faire ─
  chat.xl:
    machine: runpod
    backend: ollama
    model: qwen2.5:72b
    gpu: true
    description: "Très gros LLM (RunPod) — raisonnement maximal, contexte long"

  video.hd:
    machine: runpod
    backend: comfyui
    model: ltx-video             # ou hunyuan-video / cogvideox (gros GPU)
    gpu: true
    workflow: config/comfyui_video_hd_workflow.json
    description: "Vidéo HQ 10-20 s, 768p+ (RunPod, gros GPU)"

# Politique de sélection chat (utilisée par le Scheduler)
# L'agent peut surcharger avec hint: fast | deep
chat_policy:
  default: fast
  deep_triggers:
    - "stratégie"
    - "analyse"
    - "réflexion"
    - "brainstorming"
    - "code"
    - "architecture"
  # Déclencheurs du palier RunPod (gros modèle cloud) — actifs si RUNPOD_ENABLED=true
  xl_triggers:
    - "gros modèle"
    - "modèle maximal"
    - "runpod"
    - "puissance maximale"
    - "réflexion profonde"
    - "72b"
    - "70b"
