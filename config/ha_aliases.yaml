# Alias Home Assistant — adapté aux entités réelles de la maison
# ───────────────────────────────────────────────────────────────────────────
# Format :
#   "phrase telle que tu la dis": entity_id            (une seule entité)
#   "autre phrase": [entity_id_1, entity_id_2, ...]     (plusieurs entités)
#
# - Casse, accents et PLURIELS ignorés : « volet chambre » matche aussi
#   « ferme les VOLETS de la CHAMBRE stp ». Inutile de doubler les formes.
# - L'alias matche si TOUS ses mots sont présents dans ta phrase.
# - Les ancres YAML (&nom / *nom) évitent de répéter les listes.
# - Ce fichier est rechargé à chaud (pas besoin de redémarrer l'API).

aliases:

  # ─── LUMIÈRES (3 ampoules connectées : salon, séjour, chambre) ─────────────
  "lumière salon":     light.luminaire_salon
  "luminaire salon":   light.luminaire_salon
  "lampe salon":       light.luminaire_salon

  "lumière séjour":    light.sejour
  "lampe séjour":      light.sejour

  "lumière chambre":   light.chambre
  "lampe chambre":     light.chambre

  "toutes les lumières": &all_lights [light.luminaire_salon, light.sejour, light.chambre]
  "toutes lumières":     *all_lights

  # ─── VOLETS ────────────────────────────────────────────────────────────────
  "volet chambre":         cover.chambre
  "volet bureau":          cover.bureau
  "volet cuisine":         cover.cuisine
  "volet salle à manger":  cover.salle_a_manger
  "volet salle manger":    cover.salle_a_manger
  "volet salle de bain":   cover.salle_de_bain
  "volet salle bain":      cover.salle_de_bain
  "volet salon droite":    cover.salon_droite
  "volet salon gauche":    cover.salon_gauche
  "volets salon":          [cover.salon_droite, cover.salon_gauche]
  "volet séjour":          cover.sejour
  # NB : pas d'alias « baie » seul — trop ambigu dans une phrase.
  "baie vitrée":           cover.baie_vitree

  # Tous les volets ensemble
  "volets maison": &all_covers [cover.baie_vitree, cover.bureau, cover.chambre,
                                cover.cuisine, cover.salle_a_manger, cover.salle_de_bain,
                                cover.salon_droite, cover.salon_gauche, cover.sejour]
  "tous les volets":       *all_covers

  # Volets par étage
  "volets rdc": &covers_rdc [cover.salon_droite, cover.salon_gauche, cover.sejour,
                             cover.baie_vitree, cover.cuisine, cover.salle_a_manger,
                             cover.salle_de_bain]
  "volets bas":            *covers_rdc
  "volets étage": &covers_etage [cover.chambre, cover.bureau]
  "volets haut":           *covers_etage

  # ─── MULTIMÉDIA & ÉLECTRONIQUE (prises connectées Tapo P300) ───────────────
  "télé":                  switch.unnamed_p300_tv_samsung
  "télévision":            switch.unnamed_p300_tv_samsung
  "tv salon":              switch.unnamed_p300_tv_samsung
  "tv samsung":            switch.unnamed_p300_tv_samsung
  "grand écran":           switch.unnamed_p300_tv_samsung

  # NB : pas d'alias « son » seul — c'est aussi le possessif français
  # (« la lampe de son bureau » couperait la barre de son).
  "barre de son":          switch.unnamed_p300_barre_de_son
  "barre son":             switch.unnamed_p300_barre_de_son
  "enceinte":              switch.unnamed_p300_barre_de_son

  "ps5":                   switch.unnamed_p300_ps5
  "playstation":           switch.unnamed_p300_ps5
  "console":               switch.unnamed_p300_ps5

  "home cinéma":           [switch.unnamed_p300_tv_samsung, switch.unnamed_p300_barre_de_son]

  # PC Gaming
  "pc gaming":             switch.pc_gaming
  "pc":                    switch.pc_gaming
  "ordinateur":            switch.pc_gaming

  # Shield (Android TV)
  "shield":                media_player.shield
  "shield salon":          media_player.shield
  "shield chambre":        media_player.shield_2
  "android tv":            media_player.shield

  # TV chambre
  "tv chambre":            media_player.tv_chambre
  "télé chambre":          media_player.tv_chambre

  # ─── PRISE FOUR (entité nommée prise_chambre mais c'est le four) ───────────
  "four":                  switch.prise_chambre
  "prise four":            switch.prise_chambre
  "cu four":               switch.prise_chambre
  "prise chambre":         switch.prise_chambre

  # ─── CLIMATISATION (Qlima — clim uniquement) ───────────────────────────────
  "clim":                  climate.qlima_p7_p8
  "climatisation":         climate.qlima_p7_p8
  "climatiseur":           climate.qlima_p7_p8
  "qlima":                 climate.qlima_p7_p8
  "clim power":            switch.qlima_p7_p8_power
  "alimentation clim":     switch.qlima_p7_p8_power

  # ─── CHAUFFAGE (thermostat Netatmo — pompe à chaleur) ──────────────────────
  "chauffage":             climate.unknown_2935304596
  "thermostat":            climate.unknown_2935304596
  "pompe à chaleur":       climate.unknown_2935304596
  "netatmo":               climate.unknown_2935304596

  # ─── EAU CHAUDE ────────────────────────────────────────────────────────────
  "eau chaude":            water_heater.eau_chaude
  "chauffe-eau":           water_heater.eau_chaude
  "ballon eau":            water_heater.eau_chaude
  "cumulus":               water_heater.eau_chaude

# ─── Domaines reconnus pour la correspondance par nom convivial ──────────────
# (quand aucun alias ne matche). Ne touche pas sauf besoin.
controllable_domains:
  - light
  - switch
  - media_player
  - cover
  - climate
  - water_heater
  - fan
  - input_boolean
