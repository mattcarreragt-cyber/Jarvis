# Services sur Unraid (chef d'orchestre — toujours allumé)
name: jarvis

services:

  dashboard:
    build:
      context: ./dashboard
      args:
        # Par défaut : API en HTTP sur le LAN. Pour un accès Tailscale HTTPS
        # (micro/voix), définis API_PUBLIC_URL dans .env, ex. :
        #   API_PUBLIC_URL=https://tower.tail248307.ts.net:8443
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://${HOST_IP:-localhost}:4500}
        NEXT_PUBLIC_API_KEY: ${API_KEY:-}
    restart: unless-stopped
    ports:
      - "1200:3000"
    depends_on:
      - api
    networks:
      - jarvis

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "4500:4500"
    env_file: .env
    # Lance les migrations puis démarre l'API
    command: >
      sh -c "cd /app && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 4500 --workers 1"
    volumes:
      # Docker socket — permet à l'Agent Unraid de lire les conteneurs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # État Unraid (array, disques) — read-only, fichiers de l'hôte
      - /var/local/emhttp:/var/local/emhttp:ro
      # Capability Registry — éditable à chaud sur l'hôte sans rebuild
      - ./config:/app/config:ro
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      UNRAID_EMHTTP_PATH: /var/local/emhttp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - jarvis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jarvis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jarvis

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - jarvis

  # ─── Palier LOCAL Unraid (CPU) : parler à JARVIS sans réveiller Kubuntu ───
  # Petit LLM CPU pour les commandes simples. Après le 1er démarrage, charge le
  # modèle :  docker exec ollama-cpu ollama pull qwen2.5:3b
  ollama-cpu:
    image: ollama/ollama:latest
    container_name: ollama-cpu
    restart: unless-stopped
    volumes:
      - ollama_cpu_data:/root/.ollama
    networks:
      - jarvis

  # Transcription audio → texte en CPU (modèle « base », léger).
  whisper-cpu:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper-cpu
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: base
    volumes:
      - whisper_cpu_cache:/root/.cache
    networks:
      - jarvis

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_cpu_data:
  whisper_cpu_cache:

networks:
  jarvis:
    driver: bridge
